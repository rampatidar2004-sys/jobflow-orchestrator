spring:
  application:
    name: jobflow-orchestrator

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobflow}
    username: ${DB_USERNAME:jobflow}
    password: ${DB_PASSWORD:jobflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

jobflow:
  scheduler:
    worker-pool-size: ${SCHEDULER_WORKER_POOL_SIZE:8}
    claim-batch-size: ${SCHEDULER_CLAIM_BATCH_SIZE:20}
    poll-interval-ms: ${SCHEDULER_POLL_INTERVAL_MS:1000}
    lease-duration-seconds: ${SCHEDULER_LEASE_DURATION_SECONDS:60}
    lease-recovery-interval-ms: ${SCHEDULER_LEASE_RECOVERY_INTERVAL_MS:15000}
  security:
    jwt-secret: ${JWT_SECRET:change-me-in-production-min-32-chars-long}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.jobflow.orchestrator: INFO
